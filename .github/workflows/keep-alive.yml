name: Keep API warm

# Render's free tier stops the instance after ~15 minutes with no traffic, and the
# next request then pays a cold start of roughly three minutes - long enough that a
# till looks broken to the cashier standing at it. Pinging well inside that window
# keeps the instance from ever stopping, which is what makes the free tier usable
# for real shops.
#
# Two things to know about this schedule:
#   * GitHub runs cron on a best-effort basis and delays of several minutes are
#     normal, so the interval is set well under the 15 minute window rather than
#     close to it.
#   * GitHub disables scheduled workflows in a repository with no commits for 60
#     days. If the API starts sleeping again, check that this workflow is still
#     enabled before looking anywhere else.
#
# Staying awake costs about 744 instance-hours a month against the free tier's 750,
# so this only works while no other free web service is running in the workspace.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

# A run still in progress must not stack up behind a delayed one.
concurrency:
  group: keep-alive
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping readiness endpoint
        run: |
          # --retry covers the case where the ping itself is what wakes the
          # instance: the first attempt can time out while the JVM is starting.
          curl -fsS --max-time 60 --retry 5 --retry-delay 30 --retry-all-errors \
            https://mobileposonline-api.onrender.com/internal/actuator/health/readiness
