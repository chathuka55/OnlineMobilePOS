name: Deploy

# This publishes images to GHCR and deploys them over SSH to a self-hosted VPS.
# The service currently runs on Render and Vercel, which deploy from git on their
# own, so there is no VPS for this to reach and it failed on every push to main.
# It stays here for the move to a VPS, but has to be started by hand until then.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: production
        type: choice
        options: [staging, production]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/possaas-api
  DASHBOARD_IMAGE: ghcr.io/${{ github.repository_owner }}/possaas-dashboard

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate

      - name: Build API jar
        run: |
          chmod +x gradlew
          ./gradlew :backend:app:bootJar -x test

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ github.sha }}
            ${{ env.API_IMAGE }}:latest

      - name: Build & push dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/dashboard.Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.PUBLIC_API_URL }}
          tags: |
            ${{ env.DASHBOARD_IMAGE }}:${{ github.sha }}
            ${{ env.DASHBOARD_IMAGE }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/possaas
            export API_IMAGE=${{ env.API_IMAGE }}:${{ github.sha }}
            export DASHBOARD_IMAGE=${{ env.DASHBOARD_IMAGE }}:${{ github.sha }}
            docker compose --env-file .env -f infra/docker/compose.prod.yml pull api dashboard
            docker compose --env-file .env -f infra/docker/compose.prod.yml up -d api dashboard nginx
            docker compose --env-file .env -f infra/docker/compose.prod.yml ps
