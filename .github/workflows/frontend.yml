name: Frontend CI/CD

# Checks only. Both front ends are connected to this repository in Vercel with
# main as their production branch, so Vercel builds and deploys every push by
# itself. The deploy job that used to live here shelled out to the Vercel CLI as
# well, needed four secrets to do it, and failed on every run - it was doing a
# second time, badly, what Vercel was already doing.

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
