global:
  scrape_interval: 10s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: possaas-api
    metrics_path: /internal/actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          service: api
          env: development
