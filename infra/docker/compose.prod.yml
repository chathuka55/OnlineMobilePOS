name: possaas-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_OWNER_USER}
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD}
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    command:
      - postgres
      - -c
      - max_connections=300
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=2GB
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /backups/wal/%f && cp %p /backups/wal/%f
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-backups:/backups
    networks: [internal]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_OWNER_USER} -d ${DB_NAME}']
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: always
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks: [internal]
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:latest
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio-data:/data
    networks: [internal]
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    image: ${API_IMAGE:-ghcr.io/possaas/api:latest}
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file: ../../.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      S3_ENDPOINT: http://minio:9000
    networks: [internal]
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8080/internal/actuator/health/readiness']
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s

  dashboard:
    image: ${DASHBOARD_IMAGE:-ghcr.io/possaas/dashboard:latest}
    restart: always
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL}
    networks: [internal]

  nginx:
    image: nginx:1.27-alpine
    restart: always
    depends_on:
      - api
      - dashboard
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
      - ../nginx/certs:/etc/nginx/certs:ro
      - nginx-logs:/var/log/nginx
    networks: [internal, public]

  backup:
    image: postgres:16-alpine
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file: ../../.env
    environment:
      PGHOST: postgres
      PGUSER: ${DB_OWNER_USER}
      PGPASSWORD: ${DB_OWNER_PASSWORD}
      PGDATABASE: ${DB_NAME}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-possaas}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ../scripts/backup-postgres.sh:/backup.sh:ro
      - postgres-backups:/backups
    entrypoint:
      [
        '/bin/sh',
        '-c',
        'apk add --no-cache curl aws-cli >/dev/null && while true; do /backup.sh; sleep 86400; done',
      ]
    networks: [internal]

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: always
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks: [internal]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d

  grafana:
    image: grafana/grafana:11.3.1
    restart: always
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks: [internal]

networks:
  internal:
    driver: bridge
  public:
    driver: bridge

volumes:
  postgres-data:
  postgres-backups:
  redis-data:
  minio-data:
  nginx-logs:
  prometheus-data:
  grafana-data:
