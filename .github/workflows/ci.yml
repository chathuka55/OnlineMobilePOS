name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Compile
        run: ./gradlew classes

      - name: Test
        run: ./gradlew test

      # Gradle prints failures to the job log, which only repository admins can
      # download. Re-emitting them as workflow error commands turns each one into
      # a check annotation, visible on the commit and readable through the API, so
      # a red build can be diagnosed without admin rights.
      - name: Annotate test failures
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          found = False
          for path in glob.glob('**/build/test-results/test/*.xml', recursive=True):
              try:
                  root = ET.parse(path).getroot()
              except ET.ParseError:
                  continue
              for case in root.iter('testcase'):
                  for bad in list(case.findall('failure')) + list(case.findall('error')):
                      found = True
                      where = f"{case.get('classname')}.{case.get('name')}"
                      detail = ((bad.get('message') or bad.get('type') or '')
                                + ' | ' + (bad.text or '').strip().split(chr(10))[0])
                      detail = detail.replace(chr(10), ' ').replace(chr(13), ' ')[:600]
                      print(f"::error title={where}::{detail}")
          if not found:
              print("::error title=No test XML::the build failed before any test ran")
          PY

      - name: Build boot jar
        run: ./gradlew :backend:app:bootJar -x test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
          retention-days: 7

  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - run: pnpm install --no-frozen-lockfile

      - run: pnpm format:check

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
          VITE_API_URL: http://localhost:8080

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [backend]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: false
          tags: possaas/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
