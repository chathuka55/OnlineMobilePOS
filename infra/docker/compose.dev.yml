name: possaas-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: possaas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-possaas}
      POSTGRES_USER: ${DB_OWNER_USER:-possaas}
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:-possaas}
      # Deterministic collation keeps index behaviour identical across dev machines.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      - -c
      - log_min_duration_statement=500
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_OWNER_USER:-possaas} -d ${DB_NAME:-possaas}']
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: possaas-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:latest
    container_name: possaas-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-possaas}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-possaas123}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 12

  minio-init:
    image: minio/mc:latest
    container_name: possaas-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-possaas} ${S3_SECRET_KEY:-possaas123};
      mc mb --ignore-existing local/${S3_BUCKET:-possaas};
      mc anonymous set none local/${S3_BUCKET:-possaas};
      echo 'MinIO bucket ready';
      "

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    container_name: possaas-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-possaas}
      DB_OWNER_USER: ${DB_OWNER_USER:-possaas}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:-possaas}
      DB_APP_USER: ${DB_APP_USER:-possaas_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-possaas_app_pw}
      REDIS_HOST: redis
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-possaas}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-possaas123}
      S3_BUCKET: ${S3_BUCKET:-possaas}
      JWT_SECRET: ${JWT_SECRET:-ZGV2LW9ubHktc2VjcmV0LWRvLW5vdC11c2UtaW4tcHJvZHVjdGlvbi0xMjM0NTY3ODkw}
    ports:
      - '${SERVER_PORT:-8080}:8080'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8080/internal/actuator/health/readiness']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

volumes:
  postgres-data:
  redis-data:
  minio-data:
