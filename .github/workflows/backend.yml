name: Backend CI/CD

# Tests only. The API is a Render service connected to this repository, so Render
# builds and deploys it from git on its own. The deploy job that used to live here
# installed the Railway CLI and pushed there instead - a provider this project does
# not use - so it failed with "command not found" on every backend push.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: possaas_test
          POSTGRES_USER: possaas_owner
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Run tests
        run: ./gradlew test
        env:
          DB_OWNER_URL: jdbc:postgresql://localhost:5432/possaas_test
          DB_OWNER_USER: possaas_owner
          DB_OWNER_PASSWORD: test_password
          DB_APP_URL: jdbc:postgresql://localhost:5432/possaas_test
          DB_APP_USER: possaas_owner
          DB_APP_PASSWORD: test_password
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-key-for-ci-only-min-32-chars
