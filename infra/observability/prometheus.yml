global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: possaas-api
    metrics_path: /internal/actuator/prometheus
    scrape_interval: 10s
    static_configs:
      - targets: ['api:8080']
        labels:
          service: api
          env: production

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
